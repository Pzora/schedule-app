<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單位排休系統</title>
  <!-- 引入 Firebase 雲端資料庫套件 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root { --primary: #4f46e5; --bg: #f3f4f6; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: var(--bg); color: #333; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    h2, h3, h4 { margin-top: 0; }
    .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    button.secondary { background: #6b7280; }
    button.danger { background: #ef4444; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .weekday { font-weight: bold; text-align: center; padding: 5px; background: #e5e7eb; border-radius: 4px; }
    .day-cell { background: white; border: 1px solid #e5e7eb; min-height: 90px; padding: 5px; border-radius: 6px; cursor: pointer; position: relative; }
    .day-cell.other-month { opacity: 0.3; background: #f9fafb; }
    .day-num { font-weight: bold; font-size: 0.9em; margin-bottom: 4px; }
    .tag { font-size: 0.75em; padding: 2px 6px; border-radius: 10px; color: white; margin-bottom: 2px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
    .option-btn { width: 100%; text-align: left; padding: 10px; margin-bottom: 8px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: white; display: inline-block; }
  </style>
</head>
<body>

<div class="container">
  <!-- 登入卡片 -->
  <div class="card" id="loginCard">
    <h3>🔑 使用者登入</h3>
    <div class="flex">
      <input type="text" id="loginUser" placeholder="員工暱稱">
      <input type="password" id="loginPass" placeholder="密碼 (預設1234)">
      <button onclick="login()">登入</button>
    </div>
  </div>

  <!-- 登入後狀態面板 -->
  <div class="card" id="userCard" style="display: none;">
    <div class="flex" style="justify-content: space-between;">
      <div>
        <strong>當前登入：</strong> <span id="currentUserText">--</span> 
        (<span id="userRoleText">--</span>)
      </div>
      <div class="flex">
        <button class="secondary" onclick="toggleChangePassPanel()">🔒 修改密碼</button>
        <button class="secondary" onclick="logout()">登出</button>
      </div>
    </div>

    <!-- 修改密碼區 -->
    <div id="changePassPanel" style="display: none; margin-top: 15px; border-top: 1px dotted #ccc; padding-top: 15px; background: #f9fafb; padding: 10px; border-radius: 8px;">
      <h4 style="margin-bottom: 8px;">✏️ 修改我的密碼</h4>
      <div class="flex">
        <input type="password" id="newPass" placeholder="請輸入新密碼">
        <button onclick="changePassword()">確認修改</button>
      </div>
    </div>

    <!-- 主管專屬管理區 -->
    <div id="adminPanel" style="display: none; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
      <h3>⚙️ 主管管理面板</h3>
      
      <h4>1. 設定本月截止日期</h4>
      <div class="flex">
        <input type="date" id="deadlineDate">
        <input type="time" id="deadlineTime" value="23:59">
        <button onclick="saveDeadline()">儲存截止時間</button>
      </div>
      <p id="currentDeadlineText" style="font-size:0.85em; color: #666;"></p>

      <h4>2. 新增員工</h4>
      <div class="flex">
        <input type="text" id="empName" placeholder="員工暱稱" style="width: 120px;">
        <input type="color" id="empColor" value="#3b82f6">
        <button onclick="addEmployee()">新增員工</button>
      </div>
      <p style="font-size:0.8em; color:#888;">預設密碼為 <code>1234</code></p>
      <div id="empList" style="margin-top: 10px;" class="flex"></div>

      <h4 style="margin-top: 15px;">3. 重設員工密碼 (救援功能)</h4>
      <div class="flex">
        <select id="resetEmpSelect"></select>
        <input type="password" id="resetEmpPass" placeholder="新密碼" style="width: 120px;">
        <button class="secondary" onclick="resetEmployeePassword()">重設密碼</button>
      </div>
    </div>
  </div>

  <!-- 月曆區 -->
  <div class="card">
    <div class="calendar-header">
      <button onclick="changeMonth(-1)">❮ 上個月</button>
      <h2 id="monthTitle" style="margin:0;"></h2>
      <button onclick="changeMonth(1)">下個月 ❯</button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
</div>

<!-- 彈窗 -->
<div class="modal" id="scheduleModal">
  <div class="modal-content">
    <h3 id="modalTitle">選擇行程</h3>
    <div id="modalOptions"></div>
    <button class="secondary" style="width:100%; margin-top:10px;" onclick="closeModal()">取消 / 關閉</button>
  </div>
</div>

<script>
  // --- 雲端資料庫設定區 (選填，若沒設定會自動退回單機 LocalStorage 模式) ---
  // 可申請免費 Firebase Realtime Database 填入下方以啟用跨裝置同步
  const firebaseConfig = {
    databaseURL: "" 
  };
  
  let useFirebase = false;
  let db = null;

  if (firebaseConfig.databaseURL) {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      useFirebase = true;
    } catch(e) { console.log("使用本機儲存模式"); }
  }

  let today = new Date();
  let currentYear = today.getFullYear();
  let currentMonth = today.getMonth();
  let currentUser = null;
  let selectedDateStr = "";

  // 初始化狀態（已清空預設 ABC）
  let state = {
    deadline: `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-20T23:59`,
    admin: { username: 'admin', pass: '1234' },
    employees: [],
    schedules: {}
  };

  // 載入資料
  function initData() {
    if (useFirebase) {
      db.ref('scheduleState').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          state = val;
          if (!state.employees) state.employees = [];
          if (!state.schedules) state.schedules = {};
        }
        renderCalendar();
        if (currentUser && currentUser.role === 'admin') renderEmpList();
      });
    } else {
      const local = localStorage.getItem('scheduleStateV2');
      if (local) state = JSON.parse(local);
      renderCalendar();
    }
  }

  function saveState() {
    if (useFirebase) {
      db.ref('scheduleState').set(state);
    } else {
      localStorage.setItem('scheduleStateV2', JSON.stringify(state));
    }
  }

  window.onload = () => {
    initData();
    updateDeadlineUI();
  };

  function login() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();

    if (user === state.admin.username && pass === state.admin.pass) {
      currentUser = { username: 'admin', role: 'admin', name: '主管' };
    } else {
      const emp = state.employees.find(e => e.username === user && e.pass === pass);
      if (emp) {
        currentUser = { ...emp, role: 'employee' };
      } else {
        return alert("❌ 帳號或密碼錯誤！");
      }
    }

    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('userCard').style.display = 'block';
    document.getElementById('currentUserText').innerText = currentUser.name;
    document.getElementById('userRoleText').innerText = currentUser.role === 'admin' ? "主管" : "員工";
    
    if (currentUser.role === 'admin') {
      document.getElementById('adminPanel').style.display = 'block';
      renderEmpList();
    } else {
      document.getElementById('adminPanel').style.display = 'none';
    }

    renderCalendar();
  }

  function logout() {
    currentUser = null;
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('userCard').style.display = 'none';
    document.getElementById('changePassPanel').style.display = 'none';
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    renderCalendar();
  }

  function toggleChangePassPanel() {
    const panel = document.getElementById('changePassPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }

  function changePassword() {
    const newPass = document.getElementById('newPass').value.trim();
    if (!newPass) return alert("請輸入新密碼！");

    if (currentUser.role === 'admin') {
      state.admin.pass = newPass;
    } else {
      const emp = state.employees.find(e => e.username === currentUser.username);
      if (emp) {
        emp.pass = newPass;
        currentUser.pass = newPass;
      }
    }

    saveState();
    document.getElementById('newPass').value = '';
    toggleChangePassPanel();
    alert("✅ 密碼修改成功！");
  }

  // 主管重設員工密碼
  function resetEmployeePassword() {
    const empUsername = document.getElementById('resetEmpSelect').value;
    const newPass = document.getElementById('resetEmpPass').value.trim();
    if (!newPass) return alert("請輸入新密碼！");

    const emp = state.employees.find(e => e.username === empUsername);
    if (emp) {
      emp.pass = newPass;
      saveState();
      document.getElementById('resetEmpPass').value = '';
      alert(`✅ 已成功將 ${emp.name} 的密碼重設為：${newPass}`);
    }
  }

  function renderCalendar() {
    document.getElementById('monthTitle').innerText = `${currentYear} / ${String(currentMonth + 1).padStart(2, '0')}`;
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    weekdays.forEach(w => {
      grid.innerHTML += `<div class="weekday">${w}</div>`;
    });

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      grid.innerHTML += `<div class="day-cell other-month"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const daySchedules = (state.schedules && state.schedules[dateStr]) || [];

      let tagsHTML = daySchedules.map(s => 
        `<span class="tag" style="background-color: ${s.color};">${s.empName}${s.type}</span>`
      ).join('');

      grid.innerHTML += `
        <div class="day-cell" onclick="openModal('${dateStr}')">
          <div class="day-num">${day}</div>
          ${tagsHTML}
        </div>
      `;
    }
  }

  function openModal(dateStr) {
    if (!currentUser) return alert("🔒 請先登入帳號才能進行排休操作！");

    selectedDateStr = dateStr;
    const modal = document.getElementById('scheduleModal');
    const optionsDiv = document.getElementById('modalOptions');
    document.getElementById('modalTitle').innerText = `設定 ${dateStr} 行程`;

    const now = new Date();
    const deadline = new Date(state.deadline);
    if (currentUser.role !== 'admin' && now > deadline) {
      return alert("⚠️ 已超過主管設定的修改截止日期，無法新增或修改排休！");
    }

    optionsDiv.innerHTML = '';

    let targetEmployees = (currentUser.role === 'admin') ? state.employees : [currentUser];

    targetEmployees.forEach(emp => {
      ['休', '指休'].forEach(type => {
        optionsDiv.innerHTML += `
          <button class="option-btn" style="background-color: ${emp.color}" onclick="addSchedule('${emp.name}', '${type}', '${emp.color}')">
            <span class="dot"></span> ${emp.name}${type}
          </button>
        `;
      });
    });

    optionsDiv.innerHTML += `
      <button class="option-btn danger" style="margin-top: 15px;" onclick="clearSchedule()">
        🗑️ 清除該日自己的排休
      </button>
    `;

    modal.style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('scheduleModal').style.display = 'none';
  }

  function addSchedule(empName, type, color) {
    if (!state.schedules) state.schedules = {};
    if (!state.schedules[selectedDateStr]) state.schedules[selectedDateStr] = [];
    
    state.schedules[selectedDateStr] = state.schedules[selectedDateStr].filter(s => s.empName !== empName);
    state.schedules[selectedDateStr].push({ empName, type, color });
    
    saveState();
    renderCalendar();
    closeModal();
  }

  function clearSchedule() {
    if (!state.schedules || !state.schedules[selectedDateStr]) return closeModal();

    if (currentUser.role === 'admin') {
      delete state.schedules[selectedDateStr];
    } else {
      state.schedules[selectedDateStr] = state.schedules[selectedDateStr].filter(s => s.empName !== currentUser.name);
    }

    saveState();
    renderCalendar();
    closeModal();
  }

  function addEmployee() {
    const name = document.getElementById('empName').value.trim();
    const color = document.getElementById('empColor').value;

    if (!name) return alert("請輸入員工暱稱！");
    if (state.employees.some(e => e.username === name)) return alert("該暱稱已存在！");

    state.employees.push({ id: Date.now().toString(), username: name, pass: '1234', name, color });
    saveState();
    document.getElementById('empName').value = '';
    renderEmpList();
    alert(`員工 ${name} 新增成功！預設密碼為 1234`);
  }

  function renderEmpList() {
    const list = document.getElementById('empList');
    const select = document.getElementById('resetEmpSelect');
    
    list.innerHTML = state.employees.map(e => 
      `<span class="tag" style="background:${e.color}; font-size: 0.9em; padding: 4px 8px;">${e.name}</span>`
    ).join('');

    select.innerHTML = state.employees.map(e => 
      `<option value="${e.username}">${e.name}</option>`
    ).join('');
  }

  function saveDeadline() {
    const date = document.getElementById('deadlineDate').value;
    const time = document.getElementById('deadlineTime').value;
    if (!date) return alert("請選擇日期");

    state.deadline = `${date}T${time}`;
    saveState();
    updateDeadlineUI();
    alert("截止時間已更新！");
  }

  function updateDeadlineUI() {
    document.getElementById('currentDeadlineText').innerText = `目前設定截止時間：${state.deadline.replace('T', ' ')}`;
  }

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  }
</script>

</body>
</html>
