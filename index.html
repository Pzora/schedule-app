<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>單位排休系統</title>
  <!-- 引入 Firebase 雲端資料庫 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
    :root { --primary: #4f46e5; --bg: #f3f4f6; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px 6px; background: var(--bg); color: #333; }
    .container { max-width: 1000px; margin: 0 auto; } /* 電腦版最大寬度限制 */
    .card { background: white; padding: 12px 14px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 10px; }
    h2, h3, h4 { margin-top: 0; }
    .flex { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    button { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85em; }
    button.secondary { background: #6b7280; }
    button.danger { background: #ef4444; }
    button.success { background: #10b981; font-weight: bold; }
    input, select { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85em; }
    
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    
    .calendar-grid { 
      display: grid; 
      grid-template-columns: repeat(7, 1fr); 
      gap: 4px; 
      width: 100%;
    }
    .weekday { font-weight: bold; text-align: center; padding: 6px 0; background: #e5e7eb; border-radius: 4px; font-size: 0.85em; }
    
    /* 1. 電腦 / 平板版 (螢幕寬度 > 768px) */
    .day-cell { 
      background: white; 
      border: 1px solid #e5e7eb; 
      min-height: 85px; 
      padding: 4px; 
      border-radius: 6px; 
      cursor: pointer; 
      position: relative;
      overflow-y: auto;
    }
    .day-cell.other-month { opacity: 0.25; background: #f9fafb; }
    .day-num { font-weight: bold; font-size: 0.85em; margin-bottom: 4px; line-height: 1; color: #444; }
    
    /* 電腦版：單行橫向精緻標籤 */
    .tag-container {
      border-radius: 4px;
      margin-bottom: 3px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: row; 
      justify-content: space-between;
      align-items: center;
      padding: 2px 5px;
    }
    .tag-name {
      font-size: 0.75em;
      font-weight: 600;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tag-type {
      font-size: 0.7em;
      font-weight: bold;
      padding-left: 4px;
      white-space: nowrap;
    }

    /* 2. 手機版專屬樣式 (螢幕寬度 <= 767px) */
    @media (max-width: 767px) {
      body { padding: 8px 4px; }
      .card { padding: 8px 6px; }

      /* 手機版：拉高格子填滿螢幕 */
      .day-cell { 
        min-height: 92px; 
        padding: 3px; 
      }
      .day-num { font-size: 0.75em; margin-bottom: 2px; }

      /* 手機版：切換為雙色上下兩行 */
      .tag-container {
        flex-direction: column; 
        padding: 0;
        overflow: hidden;
      }
      .tag-name {
        font-size: 0.65em;
        padding: 2px 2px 1px 2px;
        text-align: center;
        line-height: 1.1;
      }
      .tag-type {
        font-size: 0.6em;
        padding: 1px 2px 2px 2px;
        text-align: center;
        line-height: 1.1;
        border-top: 1px solid rgba(255,255,255,0.3);
      }
    }

    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 360px; }
    .option-btn { width: 100%; text-align: left; padding: 10px; margin-bottom: 8px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: white; display: inline-block; }
    
    .emp-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; width: 100%; }
    .save-bar { background: #fffbebfb; border: 1px solid #fcd34d; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

<div class="container">
  <!-- 登入 / 註冊卡片 -->
  <div class="card" id="loginCard">
    <div class="flex" style="justify-content: space-between;">
      <h3 id="authTitle" style="margin:0; font-size: 1em;">🔑 使用者登入</h3>
      <button class="secondary" style="font-size:0.75em; padding:3px 6px;" onclick="toggleAuthMode()" id="toggleAuthBtn">註冊</button>
    </div>

    <!-- 登入表單 -->
    <div id="loginForm" style="margin-top: 8px;">
      <div class="flex">
        <input type="text" id="loginUser" placeholder="暱稱" style="width: 38%;">
        <input type="password" id="loginPass" placeholder="密碼" style="width: 38%;">
        <button onclick="login()">登入</button>
      </div>
    </div>

    <!-- 註冊表單 (預設隱藏) -->
    <div id="registerForm" style="display: none; margin-top: 8px;">
      <div class="flex">
        <input type="text" id="regUser" placeholder="暱稱" style="width: 32%;">
        <input type="password" id="regPass" placeholder="密碼" style="width: 32%;">
        <input type="color" id="regColor" value="#3b82f6" style="width: 32px; height: 30px; padding: 0;">
        <button onclick="register()">註冊</button>
      </div>
    </div>
  </div>

  <!-- 登入後狀態面板 -->
  <div class="card" id="userCard" style="display: none;">
    <div class="flex" style="justify-content: space-between;">
      <div style="font-size:0.85em;">
        <strong>登入：</strong> <span id="currentUserText">--</span> 
        (<span id="userRoleText">--</span>)
      </div>
      <div class="flex">
        <button class="secondary" style="font-size:0.75em; padding:3px 6px;" onclick="toggleChangePassPanel()">改密碼</button>
        <button class="secondary" style="font-size:0.75em; padding:3px 6px;" onclick="logout()">登出</button>
      </div>
    </div>

    <!-- 修改密碼區 -->
    <div id="changePassPanel" style="display: none; margin-top: 8px; border-top: 1px dotted #ccc; padding-top: 8px; background: #f9fafb; padding: 6px; border-radius: 6px;">
      <h4 style="margin-bottom: 4px; font-size: 0.85em;">✏️ 修改密碼</h4>
      <div class="flex">
        <input type="password" id="oldPass" placeholder="舊密碼" style="width: 36%;">
        <input type="password" id="newPass" placeholder="新密碼" style="width: 36%;">
        <button onclick="changePassword()">確認</button>
      </div>
    </div>

    <!-- 主管專屬管理區 -->
    <div id="adminPanel" style="display: none; margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px;">
      <h3 style="font-size:0.95em; margin-bottom: 6px;">⚙️ 主管管理面板</h3>
      
      <h4 style="font-size:0.8em; margin-bottom: 4px;">1. 設定截止時間</h4>
      <div class="flex">
        <input type="date" id="deadlineDate">
        <input type="time" id="deadlineTime" value="23:59">
        <button onclick="saveDeadline()">儲存</button>
      </div>
      <p id="currentDeadlineText" style="font-size:0.75em; color: #666; margin: 4px 0 8px 0;"></p>

      <h4 style="font-size:0.8em; margin-bottom: 4px;">2. 員工管理</h4>
      <div id="empManagementList"></div>
    </div>
  </div>

  <!-- 未儲存提示與儲存按鈕條 -->
  <div class="save-bar" id="saveBar" style="display: none;">
    <span style="color: #b45309; font-weight: bold; font-size: 0.8em;">⚠️ 有未儲存變更！</span>
    <button class="success" style="font-size: 0.8em; padding: 5px 8px;" onclick="commitChanges()">💾 送出 / 儲存</button>
  </div>

  <!-- 月曆區 -->
  <div class="card" style="padding: 8px 4px;">
    <div class="calendar-header">
      <button onclick="changeMonth(-1)">❮ 上月</button>
      <h3 id="monthTitle" style="margin:0; font-size: 1em;"></h3>
      <button onclick="changeMonth(1)">下月 ❯</button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
</div>

<!-- 彈窗 -->
<div class="modal" id="scheduleModal">
  <div class="modal-content">
    <h3 id="modalTitle" style="font-size:1em;">選擇行程</h3>
    <div id="modalOptions"></div>
    <button class="secondary" style="width:100%; margin-top:10px;" onclick="closeModal()">取消 / 關閉</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    databaseURL: "https://schedule-app-8a2fc-default-rtdb.firebaseio.com/" 
  };
  
  let useFirebase = false;
  let db = null;

  if (firebaseConfig.databaseURL) {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      useFirebase = true;
    } catch(e) { console.log("Firebase 設定錯誤"); }
  }

  let today = new Date();
  let currentYear = today.getFullYear();
  let currentMonth = today.getMonth();
  let currentUser = null;
  let selectedDateStr = "";
  let isRegisterMode = false;
  let hasUnsavedChanges = false;

  let state = {
    deadline: `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-20T23:59`,
    admin: { username: 'admin', pass: '1234' },
    employees: [],
    schedules: {}
  };

  function capitalizeName(str) {
    if (!str) return "";
    return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
  }

  // 將 HEX 顏色轉換為較淺帶透明度的 RGBA 顏色
  function getLighterColor(hex, alpha = 0.25) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const num = parseInt(c, 16);
    const r = (num >> 16) & 255;
    const g = (num >> 8) & 255;
    const b = num & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  // 判斷顏色深淺，決定文字要是黑色或白色
  function getTextColorForBg(hex) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const num = parseInt(c, 16);
    const r = (num >> 16) & 255;
    const g = (num >> 8) & 255;
    const b = num & 255;
    const brightness = (r * 299 + g * 587 + b * 114) / 1000;
    return brightness > 160 ? '#1f2937' : '#ffffff';
  }

  function initData() {
    if (useFirebase) {
      db.ref('scheduleState').on('value', (snapshot) => {
        if (hasUnsavedChanges) return;

        const val = snapshot.val();
        if (val) {
          state = val;
          if (!state.employees) state.employees = [];
          if (!state.schedules) state.schedules = {};
        }
        
        checkAutoLogin();
        renderCalendar();
        if (currentUser && currentUser.role === 'admin') renderEmpManagementList();
      });
    } else {
      const local = localStorage.getItem('scheduleStateV3');
      if (local) state = JSON.parse(local);
      checkAutoLogin();
      renderCalendar();
    }
  }

  function checkAutoLogin() {
    const savedUserJSON = localStorage.getItem('schedule_current_user');
    if (savedUserJSON && !currentUser) {
      try {
        const savedUser = JSON.parse(savedUserJSON);
        if (savedUser.role === 'admin') {
          currentUser = { username: 'Admin', role: 'admin', name: '主管' };
          showLoggedInUI();
        } else {
          const emp = state.employees.find(e => e.username.toLowerCase() === savedUser.username.toLowerCase());
          if (emp) {
            currentUser = { ...emp, role: 'employee' };
            showLoggedInUI();
          } else {
            localStorage.removeItem('schedule_current_user');
          }
        }
      } catch(e) {}
    }
  }

  function commitChanges() {
    if (useFirebase) {
      db.ref('scheduleState').set(state, (error) => {
        if (error) {
          alert("❌ 儲存失敗：" + error.message);
        } else {
          hasUnsavedChanges = false;
          document.getElementById('saveBar').style.display = 'none';
          alert("✅ 已送出並儲存！");
        }
      });
    } else {
      localStorage.setItem('scheduleStateV3', JSON.stringify(state));
      hasUnsavedChanges = false;
      document.getElementById('saveBar').style.display = 'none';
      alert("✅ 已儲存！");
    }
  }

  function markUnsaved() {
    hasUnsavedChanges = true;
    document.getElementById('saveBar').style.display = 'flex';
  }

  window.onload = () => {
    initData();
    updateDeadlineUI();
  };

  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('authTitle').innerText = isRegisterMode ? "📝 帳號註冊" : "🔑 使用者登入";
    document.getElementById('toggleAuthBtn').innerText = isRegisterMode ? "登入" : "註冊";
    document.getElementById('loginForm').style.display = isRegisterMode ? "none" : "block";
    document.getElementById('registerForm').style.display = isRegisterMode ? "block" : "none";
  }

  function register() {
    const rawInput = document.getElementById('regUser').value.trim();
    const pass = document.getElementById('regPass').value.trim();
    const color = document.getElementById('regColor').value;

    if (!rawInput || !pass) return alert("請填寫暱稱與密碼！");

    const formattedName = capitalizeName(rawInput);
    const lowerInput = rawInput.toLowerCase();

    if (lowerInput === 'admin' || state.employees.some(e => e.username.toLowerCase() === lowerInput)) {
      return alert("該暱稱已被使用！");
    }

    const newEmp = { id: Date.now().toString(), username: formattedName, pass, name: formattedName, color };
    state.employees.push(newEmp);
    
    commitChanges();

    alert(`🎉 註冊成功！暱稱：[${formattedName}]`);
    currentUser = { ...newEmp, role: 'employee' };
    localStorage.setItem('schedule_current_user', JSON.stringify(currentUser));
    showLoggedInUI();
  }

  function login() {
    if (hasUnsavedChanges && !confirm("有未儲存變更，確定繼續嗎？")) return;

    const rawUser = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    const lowerUser = rawUser.toLowerCase();

    if (lowerUser === state.admin.username.toLowerCase() && pass === state.admin.pass) {
      currentUser = { username: 'Admin', role: 'admin', name: '主管' };
    } else {
      const emp = state.employees.find(e => e.username.toLowerCase() === lowerUser && e.pass === pass);
      if (emp) {
        currentUser = { ...emp, role: 'employee' };
      } else {
        return alert("❌ 帳號或密碼錯誤！");
      }
    }

    localStorage.setItem('schedule_current_user', JSON.stringify(currentUser));
    hasUnsavedChanges = false;
    document.getElementById('saveBar').style.display = 'none';
    showLoggedInUI();
  }

  function showLoggedInUI() {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('userCard').style.display = 'block';
    document.getElementById('currentUserText').innerText = currentUser.name;
    document.getElementById('userRoleText').innerText = currentUser.role === 'admin' ? "主管" : "員工";
    
    if (currentUser.role === 'admin') {
      document.getElementById('adminPanel').style.display = 'block';
      renderEmpManagementList();
    } else {
      document.getElementById('adminPanel').style.display = 'none';
    }

    renderCalendar();
  }

  function logout() {
    if (hasUnsavedChanges && !confirm("有未儲存變更，確定登出嗎？")) return;

    currentUser = null;
    localStorage.removeItem('schedule_current_user');
    hasUnsavedChanges = false;
    document.getElementById('saveBar').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('userCard').style.display = 'none';
    document.getElementById('changePassPanel').style.display = 'none';
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    renderCalendar();
  }

  function toggleChangePassPanel() {
    const panel = document.getElementById('changePassPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }

  function changePassword() {
    const oldP = document.getElementById('oldPass').value.trim();
    const newP = document.getElementById('newPass').value.trim();

    if (!oldP || !newP) return alert("請輸入舊密碼與新密碼！");

    if (currentUser.role === 'admin') {
      if (state.admin.pass !== oldP) return alert("❌ 舊密碼錯誤！");
      state.admin.pass = newP;
    } else {
      const emp = state.employees.find(e => e.username.toLowerCase() === currentUser.username.toLowerCase());
      if (!emp || emp.pass !== oldP) return alert("❌ 舊密碼錯誤！");
      emp.pass = newP;
      currentUser.pass = newP;
    }

    commitChanges();
    document.getElementById('oldPass').value = '';
    document.getElementById('newPass').value = '';
    toggleChangePassPanel();
    alert("✅ 密碼修改成功！");
  }

  function resetEmpPass(empUsername) {
    if (!confirm(`確定要將 [${empUsername}] 密碼重置為 1234 嗎？`)) return;
    const emp = state.employees.find(e => e.username.toLowerCase() === empUsername.toLowerCase());
    if (emp) {
      emp.pass = '1234';
      commitChanges();
      alert(`✅ 已重置密碼為 1234`);
    }
  }

  function deleteEmp(empUsername) {
    if (!confirm(`確定要刪除員工 [${empUsername}] 嗎？`)) return;
    state.employees = state.employees.filter(e => e.username.toLowerCase() !== empUsername.toLowerCase());
    commitChanges();
    renderEmpManagementList();
    renderCalendar();
    alert(`已刪除 [${empUsername}]`);
  }

  function renderEmpManagementList() {
    const list = document.getElementById('empManagementList');
    if (state.employees.length === 0) {
      list.innerHTML = `<p style="color:#888; font-size:0.8em;">尚無員工註冊</p>`;
      return;
    }

    list.innerHTML = state.employees.map(e => `
      <div class="emp-row">
        <div style="font-size:0.85em;">
          <span class="dot" style="background:${e.color}"></span>
          <strong>${capitalizeName(e.name)}</strong>
        </div>
        <div class="flex">
          <button class="secondary" style="font-size:0.7em; padding:3px 6px;" onclick="resetEmpPass('${e.username}')">重置</button>
          <button class="danger" style="font-size:0.7em; padding:3px 6px;" onclick="deleteEmp('${e.username}')">刪除</button>
        </div>
      </div>
    `).join('');
  }

  function renderCalendar() {
    document.getElementById('monthTitle').innerText = `${currentYear} / ${String(currentMonth + 1).padStart(2, '0')}`;
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    weekdays.forEach(w => {
      grid.innerHTML += `<div class="weekday">${w}</div>`;
    });

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      grid.innerHTML += `<div class="day-cell other-month"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const daySchedules = (state.schedules && state.schedules[dateStr]) || [];

      let tagsHTML = daySchedules.map(s => {
        const mainColor = s.color || '#3b82f6';
        const lighterBg = getLighterColor(mainColor, 0.2); // 下層淺色底
        const typeTextColor = mainColor; // 下層文字使用代表色本身，讀取超清晰！

        return `
          <div class="tag-container" style="border: 1px solid ${mainColor};">
            <div class="tag-name" style="background-color: ${mainColor};">
              ${capitalizeName(s.empName)}
            </div>
            <div class="tag-type" style="background-color: ${lighterBg}; color: ${typeTextColor};">
              ${s.type}
            </div>
          </div>
        `;
      }).join('');

      grid.innerHTML += `
        <div class="day-cell" onclick="openModal('${dateStr}')">
          <div class="day-num">${day}</div>
          ${tagsHTML}
        </div>
      `;
    }
  }

  function openModal(dateStr) {
    if (!currentUser) return alert("🔒 請先登入！");

    selectedDateStr = dateStr;
    const modal = document.getElementById('scheduleModal');
    const optionsDiv = document.getElementById('modalOptions');
    document.getElementById('modalTitle').innerText = `設定 ${dateStr} 行程`;

    const now = new Date();
    const deadline = new Date(state.deadline);
    if (currentUser.role !== 'admin' && now > deadline) {
      return alert("⚠️ 已超過截止日期！");
    }

    optionsDiv.innerHTML = '';

    let targetEmployees = (currentUser.role === 'admin') ? state.employees : [currentUser];

    targetEmployees.forEach(emp => {
      const formattedName = capitalizeName(emp.name);
      ['休', '指休'].forEach(type => {
        optionsDiv.innerHTML += `
          <button class="option-btn" style="background-color: ${emp.color}" onclick="addSchedule('${formattedName}', '${type}', '${emp.color}')">
            <span class="dot"></span> ${formattedName}${type}
          </button>
        `;
      });
    });

    optionsDiv.innerHTML += `
      <button class="option-btn danger" style="margin-top: 10px;" onclick="clearSchedule()">
        🗑️ 清除該日行程
      </button>
    `;

    modal.style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('scheduleModal').style.display = 'none';
  }

  function addSchedule(empName, type, color) {
    if (!state.schedules) state.schedules = {};
    if (!state.schedules[selectedDateStr]) state.schedules[selectedDateStr] = [];
    
    state.schedules[selectedDateStr] = state.schedules[selectedDateStr].filter(s => s.empName.toLowerCase() !== empName.toLowerCase());
    state.schedules[selectedDateStr].push({ empName: capitalizeName(empName), type, color });
    
    markUnsaved();
    renderCalendar();
    closeModal();
  }

  function clearSchedule() {
    if (!state.schedules || !state.schedules[selectedDateStr]) return closeModal();

    if (currentUser.role === 'admin') {
      delete state.schedules[selectedDateStr];
    } else {
      state.schedules[selectedDateStr] = state.schedules[selectedDateStr].filter(s => s.empName.toLowerCase() !== currentUser.name.toLowerCase());
    }

    markUnsaved();
    renderCalendar();
    closeModal();
  }

  function saveDeadline() {
    const date = document.getElementById('deadlineDate').value;
    const time = document.getElementById('deadlineTime').value;
    if (!date) return alert("請選擇日期");

    state.deadline = `${date}T${time}`;
    commitChanges();
    updateDeadlineUI();
  }

  function updateDeadlineUI() {
    document.getElementById('currentDeadlineText').innerText = `截止時間：${state.deadline.replace('T', ' ')}`;
  }

  function changeMonth(delta) {
    if (hasUnsavedChanges && !confirm("有未儲存變更，確定切換嗎？")) return;
    
    currentMonth += delta;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  }
</script>

</body>
</html>
