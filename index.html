<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單位排休系統</title>
  <!-- 引入 Firebase 雲端資料庫 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root { --primary: #4f46e5; --bg: #f3f4f6; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: var(--bg); color: #333; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    h2, h3, h4 { margin-top: 0; }
    .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    button.secondary { background: #6b7280; }
    button.danger { background: #ef4444; }
    button.success { background: #10b981; font-weight: bold; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .weekday { font-weight: bold; text-align: center; padding: 5px; background: #e5e7eb; border-radius: 4px; }
    .day-cell { background: white; border: 1px solid #e5e7eb; min-height: 90px; padding: 5px; border-radius: 6px; cursor: pointer; position: relative; }
    .day-cell.other-month { opacity: 0.3; background: #f9fafb; }
    .day-num { font-weight: bold; font-size: 0.9em; margin-bottom: 4px; }
    .tag { font-size: 0.75em; padding: 2px 6px; border-radius: 10px; color: white; margin-bottom: 2px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
    .option-btn { width: 100%; text-align: left; padding: 10px; margin-bottom: 8px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: white; display: inline-block; }
    
    .emp-row { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; width: 100%; }
    .save-bar { background: #fffbebfb; border: 1px solid #fcd34d; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

<div class="container">
  <!-- 登入 / 註冊卡片 -->
  <div class="card" id="loginCard">
    <div class="flex" style="justify-content: space-between;">
      <h3 id="authTitle" style="margin:0;">🔑 使用者登入</h3>
      <button class="secondary" style="font-size:0.8em;" onclick="toggleAuthMode()" id="toggleAuthBtn">沒有帳號？點此註冊</button>
    </div>

    <!-- 登入表單 -->
    <div id="loginForm" style="margin-top: 10px;">
      <div class="flex">
        <input type="text" id="loginUser" placeholder="員工暱稱">
        <input type="password" id="loginPass" placeholder="密碼">
        <button onclick="login()">登入</button>
      </div>
    </div>

    <!-- 註冊表單 (預設隱藏) -->
    <div id="registerForm" style="display: none; margin-top: 10px;">
      <div class="flex">
        <input type="text" id="regUser" placeholder="設定員工暱稱">
        <input type="password" id="regPass" placeholder="設定密碼">
        <label style="font-size: 0.9em; color:#666;">代表色：<input type="color" id="regColor" value="#3b82f6"></label>
        <button onclick="register()">建立帳號並登入</button>
      </div>
    </div>
  </div>

  <!-- 登入後狀態面板 -->
  <div class="card" id="userCard" style="display: none;">
    <div class="flex" style="justify-content: space-between;">
      <div>
        <strong>當前登入：</strong> <span id="currentUserText">--</span> 
        (<span id="userRoleText">--</span>)
      </div>
      <div class="flex">
        <button class="secondary" onclick="toggleChangePassPanel()">🔒 修改密碼</button>
        <button class="secondary" onclick="logout()">登出</button>
      </div>
    </div>

    <!-- 修改密碼區 (須輸入舊密碼) -->
    <div id="changePassPanel" style="display: none; margin-top: 15px; border-top: 1px dotted #ccc; padding-top: 15px; background: #f9fafb; padding: 10px; border-radius: 8px;">
      <h4 style="margin-bottom: 8px;">✏️ 修改密碼</h4>
      <div class="flex">
        <input type="password" id="oldPass" placeholder="請輸入舊密碼">
        <input type="password" id="newPass" placeholder="請輸入新密碼">
        <button onclick="changePassword()">確認修改</button>
      </div>
    </div>

    <!-- 主管專屬管理區 -->
    <div id="adminPanel" style="display: none; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
      <h3>⚙️ 主管管理面板</h3>
      
      <h4>1. 設定本月截止日期</h4>
      <div class="flex">
        <input type="date" id="deadlineDate">
        <input type="time" id="deadlineTime" value="23:59">
        <button onclick="saveDeadline()">儲存截止時間</button>
      </div>
      <p id="currentDeadlineText" style="font-size:0.85em; color: #666;"></p>

      <h4>2. 員工帳號管理（刪除 / 重置密碼）</h4>
      <div id="empManagementList"></div>
    </div>
  </div>

  <!-- 未儲存提示與儲存按鈕條 -->
  <div class="save-bar" id="saveBar" style="display: none;">
    <span style="color: #b45309; font-weight: bold;">⚠️ 您有尚未送出的排休變更！</span>
    <button class="success" onclick="commitChanges()">💾 送出／儲存變更至雲端</button>
  </div>

  <!-- 月曆區 -->
  <div class="card">
    <div class="calendar-header">
      <button onclick="changeMonth(-1)">❮ 上個月</button>
      <h2 id="monthTitle" style="margin:0;"></h2>
      <button onclick="changeMonth(1)">下個月 ❯</button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
</div>

<!-- 彈窗 -->
<div class="modal" id="scheduleModal">
  <div class="modal-content">
    <h3 id="modalTitle">選擇行程</h3>
    <div id="modalOptions"></div>
    <button class="secondary" style="width:100%; margin-top:10px;" onclick="closeModal()">取消 / 關閉</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    databaseURL: "https://schedule-app-8a2fc-default-rtdb.firebaseio.com/" 
  };
  
  let useFirebase = false;
  let db = null;

  if (firebaseConfig.databaseURL) {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      useFirebase = true;
    } catch(e) { console.log("Firebase 設定錯誤"); }
  }

  let today = new Date();
  let currentYear = today.getFullYear();
  let currentMonth = today.getMonth();
  let currentUser = null;
  let selectedDateStr = "";
  let isRegisterMode = false;
  let hasUnsavedChanges = false;

  let state = {
    deadline: `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-20T23:59`,
    admin: { username: 'admin', pass: '1234' },
    employees: [],
    schedules: {}
  };

  function capitalizeName(str) {
    if (!str) return "";
    return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
  }

  function initData() {
    if (useFirebase) {
      db.ref('scheduleState').on('value', (snapshot) => {
        if (hasUnsavedChanges) return;

        const val = snapshot.val();
        if (val) {
          state = val;
          if (!state.employees) state.employees = [];
          if (!state.schedules) state.schedules = {};
        }
        
        // 嘗試自動還原登入狀態
        checkAutoLogin();
        renderCalendar();
        if (currentUser && currentUser.role === 'admin') renderEmpManagementList();
      });
    } else {
      const local = localStorage.getItem('scheduleStateV3');
      if (local) state = JSON.parse(local);
      checkAutoLogin();
      renderCalendar();
    }
  }

  // 檢查並恢復登入狀態
  function checkAutoLogin() {
    const savedUserJSON = localStorage.getItem('schedule_current_user');
    if (savedUserJSON && !currentUser) {
      try {
        const savedUser = JSON.parse(savedUserJSON);
        if (savedUser.role === 'admin') {
          currentUser = { username: 'Admin', role: 'admin', name: '主管' };
          showLoggedInUI();
        } else {
          // 校對是否還存在於員工清單中
          const emp = state.employees.find(e => e.username.toLowerCase() === savedUser.username.toLowerCase());
          if (emp) {
            currentUser = { ...emp, role: 'employee' };
            showLoggedInUI();
          } else {
            localStorage.removeItem('schedule_current_user');
          }
        }
      } catch(e) {}
    }
  }

  function commitChanges() {
    if (useFirebase) {
      db.ref('scheduleState').set(state, (error) => {
        if (error) {
          alert("❌ 儲存失敗：" + error.message);
        } else {
          hasUnsavedChanges = false;
          document.getElementById('saveBar').style.display = 'none';
          alert("✅ 已成功送出並儲存至雲端資料庫！");
        }
      });
    } else {
      localStorage.setItem('scheduleStateV3', JSON.stringify(state));
      hasUnsavedChanges = false;
      document.getElementById('saveBar').style.display = 'none';
      alert("✅ 已儲存！");
    }
  }

  function markUnsaved() {
    hasUnsavedChanges = true;
    document.getElementById('saveBar').style.display = 'flex';
  }

  window.onload = () => {
    initData();
    updateDeadlineUI();
  };

  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('authTitle').innerText = isRegisterMode ? "📝 員工帳號註冊" : "🔑 使用者登入";
    document.getElementById('toggleAuthBtn').innerText = isRegisterMode ? "已有帳號？點此登入" : "沒有帳號？點此註冊";
    document.getElementById('loginForm').style.display = isRegisterMode ? "none" : "block";
    document.getElementById('registerForm').style.display = isRegisterMode ? "block" : "none";
  }

  function register() {
    const rawInput = document.getElementById('regUser').value.trim();
    const pass = document.getElementById('regPass').value.trim();
    const color = document.getElementById('regColor').value;

    if (!rawInput || !pass) return alert("請填寫暱稱與密碼！");

    const formattedName = capitalizeName(rawInput);
    const lowerInput = rawInput.toLowerCase();

    if (lowerInput === 'admin' || state.employees.some(e => e.username.toLowerCase() === lowerInput)) {
      return alert("該暱稱已被使用，請換一個！");
    }

    const newEmp = { id: Date.now().toString(), username: formattedName, pass, name: formattedName, color };
    state.employees.push(newEmp);
    
    commitChanges();

    alert(`🎉 註冊成功！暱稱已調整為：[${formattedName}]，自動為您登入。`);
    currentUser = { ...newEmp, role: 'employee' };
    localStorage.setItem('schedule_current_user', JSON.stringify(currentUser)); // 記憶登入狀態
    showLoggedInUI();
  }

  function login() {
    if (hasUnsavedChanges && !confirm("您有未儲存的排休變更，切換帳號會遺失未儲存內容，確定要繼續嗎？")) return;

    const rawUser = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    const lowerUser = rawUser.toLowerCase();

    if (lowerUser === state.admin.username.toLowerCase() && pass === state.admin.pass) {
      currentUser = { username: 'Admin', role: 'admin', name: '主管' };
    } else {
      const emp = state.employees.find(e => e.username.toLowerCase() === lowerUser && e.pass === pass);
      if (emp) {
        currentUser = { ...emp, role: 'employee' };
      } else {
        return alert("❌ 帳號或密碼錯誤！");
      }
    }

    localStorage.setItem('schedule_current_user', JSON.stringify(currentUser)); // 記憶登入狀態
    hasUnsavedChanges = false;
    document.getElementById('saveBar').style.display = 'none';
    showLoggedInUI();
  }

  function showLoggedInUI() {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('userCard').style.display = 'block';
    document.getElementById('currentUserText').innerText = currentUser.name;
    document.getElementById('userRoleText').innerText = currentUser.role === 'admin' ? "主管" : "員工";
    
    if (currentUser.role === 'admin') {
      document.getElementById('adminPanel').style.display = 'block';
      renderEmpManagementList();
    } else {
      document.getElementById('adminPanel').style.display = 'none';
    }

    renderCalendar();
  }

  function logout() {
    if (hasUnsavedChanges && !confirm("您有未儲存的變更，登出後未儲存的內容將會遺失，確定要登出嗎？")) return;

    currentUser = null;
    localStorage.removeItem('schedule_current_user'); // 清除登入記憶
    hasUnsavedChanges = false;
    document.getElementById('saveBar').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('userCard').style.display = 'none';
    document.getElementById('changePassPanel').style.display = 'none';
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    renderCalendar();
  }

  function toggleChangePassPanel() {
    const panel = document.getElementById('changePassPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }

  function changePassword() {
    const oldP = document.getElementById('oldPass').value.trim();
    const newP = document.getElementById('newPass').value.trim();

    if (!oldP || !newP) return alert("請輸入舊密碼與新密碼！");

    if (currentUser.role === 'admin') {
      if (state.admin.pass !== oldP) return alert("❌ 舊密碼輸入錯誤！");
      state.admin.pass = newP;
    } else {
      const emp = state.employees.find(e => e.username.toLowerCase() === currentUser.username.toLowerCase());
      if (!emp || emp.pass !== oldP) return alert("❌ 舊密碼輸入錯誤！");
      emp.pass = newP;
      currentUser.pass = newP;
    }

    commitChanges();
    document.getElementById('oldPass').value = '';
    document.getElementById('newPass').value = '';
    toggleChangePassPanel();
    alert("✅ 密碼修改成功！");
  }

  function resetEmpPass(empUsername) {
    if (!confirm(`確定要將 [${empUsername}] 的密碼重置為 1234 嗎？`)) return;
    const emp = state.employees.find(e => e.username.toLowerCase() === empUsername.toLowerCase());
    if (emp) {
      emp.pass = '1234';
      commitChanges();
      alert(`✅ [${empUsername}] 的密碼已重置為：1234`);
    }
  }

  function deleteEmp(empUsername) {
    if (!confirm(`⚠️ 確定要刪除員工 [${empUsername}] 嗎？此動作無法復原！`)) return;
    state.employees = state.employees.filter(e => e.username.toLowerCase() !== empUsername.toLowerCase());
    commitChanges();
    renderEmpManagementList();
    renderCalendar();
    alert(`已刪除員工 [${empUsername}]`);
  }

  function renderEmpManagementList() {
    const list = document.getElementById('empManagementList');
    if (state.employees.length === 0) {
      list.innerHTML = `<p style="color:#888; font-size:0.9em;">目前尚無員工註冊</p>`;
      return;
    }

    list.innerHTML = state.employees.map(e => `
      <div class="emp-row">
        <div>
          <span class="dot" style="background:${e.color}"></span>
          <strong>${capitalizeName(e.name)}</strong>
        </div>
        <div class="flex">
          <button class="secondary" style="font-size:0.8em; padding:4px 8px;" onclick="resetEmpPass('${e.username}')">🔄 重置密碼(1234)</button>
          <button class="danger" style="font-size:0.8em; padding:4px 8px;" onclick="deleteEmp('${e.username}')">🗑️ 刪除</button>
        </div>
      </div>
    `).join('');
  }

  function renderCalendar() {
    document.getElementById('monthTitle').innerText = `${currentYear} / ${String(currentMonth + 1).padStart(2, '0')}`;
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    weekdays.forEach(w => {
      grid.innerHTML += `<div class="weekday">${w}</div>`;
    });

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      grid.innerHTML += `<div class="day-cell other-month"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const daySchedules = (state.schedules && state.schedules[dateStr]) || [];

      let tagsHTML = daySchedules.map(s => 
        `<span class="tag" style="background-color: ${s.color};">${capitalizeName(s.empName)}${s.type}</span>`
      ).join('');

      grid.innerHTML += `
        <div class="day-cell" onclick="openModal('${dateStr}')">
          <div class="day-num">${day}</div>
          ${tagsHTML}
        </div>
      `;
    }
  }

  function openModal(dateStr) {
    if (!currentUser) return alert("🔒 請先登入帳號才能進行排休操作！");

    selectedDateStr = dateStr;
    const modal = document.getElementById('scheduleModal');
    const optionsDiv = document.getElementById('modalOptions');
    document.getElementById('modalTitle').innerText = `設定 ${dateStr} 行程`;

    const now = new Date();
    const deadline = new Date(state.deadline);
    if (currentUser.role !== 'admin' && now > deadline) {
      return alert("⚠️ 已超過主管設定的修改截止日期，無法新增或修改排休！");
    }

    optionsDiv.innerHTML = '';

    let targetEmployees = (currentUser.role === 'admin') ? state.employees : [currentUser];

    targetEmployees.forEach(emp => {
      const formattedName = capitalizeName(emp.name);
      ['休', '指休'].forEach(type => {
        optionsDiv.innerHTML += `
          <button class="option-btn" style="background-color: ${emp.color}" onclick="addSchedule('${formattedName}', '${type}', '${emp.color}')">
            <span class="dot"></span> ${formattedName}${type}
          </button>
        `;
      });
    });

    optionsDiv.innerHTML += `
      <button class="option-btn danger" style="margin-top: 15px;" onclick="clearSchedule()">
        🗑️ 清除該日自己的排休
      </button>
    `;

    modal.style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('scheduleModal').style.display = 'none';
  }

  function addSchedule(empName, type, color) {
    if (!state.schedules) state.schedules = {};
    if (!state.schedules[selectedDateStr]) state.schedules[selectedDateStr] = [];
    
    state.schedules[selectedDateStr] = state.schedules[selectedDateStr].filter(s => s.empName.toLowerCase() !== empName.toLowerCase());
    state.schedules[selectedDateStr].push({ empName: capitalizeName(empName), type, color });
    
    markUnsaved();
    renderCalendar();
    closeModal();
  }

  function clearSchedule() {
    if (!state.schedules || !state.schedules[selectedDateStr]) return closeModal();

    if (currentUser.role === 'admin') {
      delete state.schedules[selectedDateStr];
    } else {
      state.schedules[selectedDateStr] = state.schedules[selectedDateStr].filter(s => s.empName.toLowerCase() !== currentUser.name.toLowerCase());
    }

    markUnsaved();
    renderCalendar();
    closeModal();
  }

  function saveDeadline() {
    const date = document.getElementById('deadlineDate').value;
    const time = document.getElementById('deadlineTime').value;
    if (!date) return alert("請選擇日期");

    state.deadline = `${date}T${time}`;
    commitChanges();
    updateDeadlineUI();
  }

  function updateDeadlineUI() {
    document.getElementById('currentDeadlineText').innerText = `目前設定截止時間：${state.deadline.replace('T', ' ')}`;
  }

  function changeMonth(delta) {
    if (hasUnsavedChanges && !confirm("切換月份前請先儲存變更，否則修改會遺失。要直接切換嗎？")) return;
    
    currentMonth += delta;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  }
</script>

</body>
</html>
